<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="600" height="120" role="img" aria-label="BitWise — Smart SaaS, end to end">
  <defs>
    <linearGradient id="sig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ab3e8"/>
      <stop offset="100%" stop-color="#1c9ad6"/>
    </linearGradient>
  </defs>

  <!-- 0x glyph: rounded square mark -->
  <rect x="2" y="24" width="96" height="96" rx="20" fill="none" stroke="url(#sig)" stroke-width="4"/>
  <text x="50" y="86" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="46" font-weight="700" fill="url(#sig)" text-anchor="middle">0x</text>

  <!-- wordmark -->
  <text x="124" y="80" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="68" font-weight="700" fill="#e7ece8" letter-spacing="-2">BitWise</text>

  <!-- tagline -->
  <text x="126" y="128" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="26" font-weight="500" fill="url(#sig)" letter-spacing="2">Smart SaaS, end-to-end</text>
</svg>
