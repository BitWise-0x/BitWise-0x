name: Update Repo Count

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-count:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get total repo count
        id: count
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TOTAL=$(gh repo list ${{ github.repository_owner }} --limit 1000 --json name | jq length)
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Update README badge
        run: |
          sed -i "s|Total_Repos-[0-9]*-|Total_Repos-${{ steps.count.outputs.total }}-|g" README.md

      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update repo count to ${{ steps.count.outputs.total }}"
          git push
