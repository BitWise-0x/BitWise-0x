name: Update Repo Count

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-count:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update repo count
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TOTAL=$(gh repo list ${{ github.repository_owner }} --limit 1000 --json name | jq length)
          CURRENT=$(grep -oP 'Total_Repos-\K[0-9]+' README.md || echo 0)

          if [ "$TOTAL" -eq 0 ]; then
            echo "Count is 0, PAT may be missing. Skipping."
            exit 0
          fi

          if [ "$TOTAL" -lt "$CURRENT" ]; then
            echo "New count ($TOTAL) is less than current ($CURRENT). Skipping to prevent downgrade."
            exit 0
          fi

          if [ "$TOTAL" -eq "$CURRENT" ]; then
            echo "Count unchanged ($TOTAL). Skipping."
            exit 0
          fi

          sed -i "s|Total_Repos-[0-9]*-|Total_Repos-${TOTAL}-|g" README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update repo count to ${TOTAL}"
          git push
