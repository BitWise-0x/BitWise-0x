name: Update Repo Count

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-count:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # owner scopes the token to every repo in the bitwise-ci install; without
      # it the token sees only this repo and private repos drop out of the count.
      - name: Mint App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read

      - name: Update repo count
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          TOTAL=$(gh repo list ${{ github.repository_owner }} --limit 1000 --json name | jq length)
          CURRENT=$(grep -oP 'Total_Repos-\K[0-9]+' README.md || echo 0)

          if [ "$TOTAL" -eq 0 ]; then
            echo "Count is 0, token may lack access. Skipping."
            exit 0
          fi

          if [ "$TOTAL" -eq "$CURRENT" ]; then
            echo "Count unchanged ($TOTAL). Skipping."
            exit 0
          fi

          sed -i "s|Total_Repos-[0-9]*-|Total_Repos-${TOTAL}-|g" README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update repo count to ${TOTAL}"
          git push
